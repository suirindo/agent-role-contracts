# Copy or merge into .github/workflows/arc.yml in your consumer repository.
# Checks the supplied declaration files, not all changed files or actual agent actions.
# First merge the reviewed bundle, pinned dependency and lockfile into the base branch.
# The workflow/check itself still needs your existing trusted review and branch protection.
# Require branches to be up to date before merge: base.sha is captured at event time.
# Merge queues need a separately reviewed merge_group workflow.
name: ARC declarations
on:
  pull_request:
permissions:
  contents: read
jobs:
  arc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: arc-trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: arc-candidate
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install only the trusted base dependency
        run: npm ci --prefix arc-trusted --ignore-scripts --include=dev --no-audit --no-fund
      - name: Require the reviewed core version
        run: node -e "const p=require('./arc-trusted/node_modules/@netsujo/agent-role-contracts/package.json');if(p.name!=='@netsujo/agent-role-contracts'||p.version!=='1.0.0')process.exit(2)"
      - name: Check the candidate task against the base authority
        run: >-
          node arc-trusted/node_modules/@netsujo/agent-role-contracts/bin/agent-role-contracts.mjs explain
          --bundle arc-trusted/.arc/bundle.json
          --task arc-candidate/.arc/task.json
          --format text
