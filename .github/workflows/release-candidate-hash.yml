name: Release candidate pack hash

on:
  pull_request:
    paths:
      - '.github/workflows/release-candidate-hash.yml'

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Use release npm
        run: |
          npm install --global npm@11.20.0 --ignore-scripts
          test "$(npm --version)" = '11.20.0'
      - name: Pack and hash candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = '0.5.0'
          mkdir -p "$RUNNER_TEMP/release-candidate"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/release-candidate" > "$RUNNER_TEMP/release-candidate/pack.json"
          TARBALL="$RUNNER_TEMP/release-candidate/netsujo-agent-role-contracts-0.5.0.tgz"
          SHA256="$(sha256sum "$TARBALL" | awk '{print $1}')"
          printf '%s  %s\n' "$SHA256" "$(basename "$TARBALL")" | tee "$RUNNER_TEMP/release-candidate/SHA256SUMS"
          {
            echo "## v0.5.0 reviewed tarball candidate"
            echo
            echo "npm: 11.20.0"
            echo "commit: $GITHUB_SHA"
            echo "sha256: $SHA256"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v0.5.0-pack-hash-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/release-candidate/netsujo-agent-role-contracts-0.5.0.tgz
            ${{ runner.temp }}/release-candidate/SHA256SUMS
            ${{ runner.temp }}/release-candidate/pack.json
          if-no-files-found: error
          retention-days: 7
