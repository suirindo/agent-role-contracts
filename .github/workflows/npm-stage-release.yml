name: npm stage release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Use staged-publishing-capable npm
        run: npm install --global npm@11.20.0
      - name: Verify exact source
        run: npm run check
      - name: Stage package for maintainer approval
        run: npm stage publish --access public
