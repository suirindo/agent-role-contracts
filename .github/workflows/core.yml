name: Agent Role Contracts CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read

concurrency:
  group: core-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  core:
    # Draft candidates stay local; the full cross-platform matrix runs once the candidate is Ready.
    if: ${{ github.event.pull_request.draft == false }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.5.0'
          - os: ubuntu-latest
            node: '24'
          - os: macos-latest
            node: '22'
          - os: windows-latest
            node: '22'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
