name: Agent Role Contracts CI
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read

concurrency:
  group: core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  core:
    # Draft candidates stay local; the full cross-platform matrix runs once the candidate is Ready.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.5.0'
          - os: ubuntu-latest
            node: '24'
          - os: macos-latest
            node: '22'
          - os: windows-latest
            node: '22'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: node --test .github/release/*.test.mjs
      - run: npm run pack:smoke
  published-consumer:
    # Exercise the registry release used by the adoption kit, separately from source main.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install the locked public 1.0.0 consumer
        run: npm ci --prefix experiments/adoption/consumer --ignore-scripts --include=dev --no-audit --no-fund
      - name: Record the installed core version
        run: npm ls --prefix experiments/adoption/consumer @netsujo/agent-role-contracts --depth=0
      - name: Verify setup, trusted inputs and actual Git hook invocation
        run: node --test experiments/adoption/tests/*.test.mjs
