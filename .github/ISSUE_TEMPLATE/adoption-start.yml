name: First setup attempt
description: Report a first attempt, including a check that could not start.
title: "[first attempt] "
body:
  - type: markdown
    attributes:
      value: |
        Share what you observed; an unsuccessful start is useful feedback. Do not invent an exit code or result for a command you did not run.
        For a real workflow and second-task evidence, use [workflow feedback](https://github.com/suirindo/agent-role-contracts/issues/new?template=workflow-feedback.yml) and the [two-task evaluation](https://github.com/suirindo/agent-role-contracts/tree/main/experiments/external-evaluation). This short report does not replace that evaluation.
        Remove credentials, customer data, private paths, and secrets before submitting.
  - type: dropdown
    id: status
    attributes:
      label: How far did you get?
      options:
        - "NOT_RUN — did not invoke a check"
        - "BLOCKED — setup or tool failure prevented a declaration result"
        - "RAN — the core checker returned a declaration result (exit 0 or 1)"
    validations:
      required: true
  - type: textarea
    id: attempt
    attributes:
      label: Attempt and observed result
      description: Name the guide step or exact command. If run, include its actual message and exit code if known. For NOT_RUN or BLOCKED, describe where you stopped. A setup helper result is separate from a core task result.
      placeholder: "Step/command: …\nObserved message/exit, or NOT_RUN: …\nWhat prevented the next step: …"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Environment and versions (if known)
      description: Node/OS, installed ARC core version, and adoption-kit source commit are separate facts. Leave unknown values unknown.
      placeholder: "Node … / OS … / core 1.0.0 / kit commit …"
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed credentials, customer data, private paths, and secrets.
          required: true
