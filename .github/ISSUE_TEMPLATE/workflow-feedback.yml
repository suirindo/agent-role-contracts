name: Real-workflow evaluation feedback
description: Share what happened when you tried Agent Role Contracts on one real or representative workflow.
title: "[workflow feedback] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing a concrete workflow. The useful signal is what changed in your process, including cases where your existing controls were already sufficient.
        For a repeatable check, see https://github.com/suirindo/agent-role-contracts/tree/main/experiments/external-evaluation .
        Synthetic second-declaration checks are separate from actual external second-task execution; provide a distinct real-task commit/CI link if one exists.
        
        Do not include credentials, customer data, private repository paths, production secrets, or other sensitive material.
  - type: textarea
    id: workflow
    attributes:
      label: Workflow evaluated
      description: Describe the narrow workflow you tested and the roles or handoff you wanted to check.
      placeholder: "Example: approved change request -> scoped implementation -> independent review -> acceptance"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ARC core version or commit
      description: Package version, dist-tag resolution, or repository commit of the ARC core under evaluation. Record the evaluation helper separately below.
      placeholder: "@netsujo/agent-role-contracts@1.0.0 or exact commit SHA"
    validations:
      required: true
  - type: input
    id: helper_revision
    attributes:
      label: Evaluation helper revision (if used)
      description: Record the exact arc-kit commit from git -C arc-kit rev-parse HEAD, separately from the ARC core version. Enter NOT USED if you did not use the helper. For an existing report, provide only the missing revision or NOT USED; do not resubmit evidence.
      placeholder: "Exact arc-kit commit SHA, or NOT USED"
    validations:
      required: false
  - type: textarea
    id: result
    attributes:
      label: What happened
      description: State the expected PASS/FAIL behavior and the result you observed.
    validations:
      required: true
  - type: textarea
    id: useful
    attributes:
      label: What was useful
      description: What inconsistency, recheck burden, or ambiguity did the contract help expose?
    validations:
      required: false
  - type: textarea
    id: friction
    attributes:
      label: What was missing or costly
      description: Note false positives, concepts you could not express, setup burden, or controls your existing stack handled better.
    validations:
      required: true
  - type: dropdown
    id: reuse
    attributes:
      label: Would you use the same contract on a second task?
      options:
        - "Yes"
        - "Maybe"
        - "No"
    validations:
      required: true
  - type: textarea
    id: second_real_task
    attributes:
      label: Actual second-task reuse evidence (optional)
      description: If you ran ARC on a different real task, link its commit/CI or reproducible operation. Intentions and synthetic second declarations do not count as executed reuse.
      placeholder: "Different task ID + exact version/commit + public CI URL, or NOT RUN"
    validations:
      required: false
  - type: textarea
    id: existing_controls
    attributes:
      label: Existing enforcement or review controls
      description: Optional. Mention IAM, CI, sandbox, runtime, approval, or evidence controls that overlap with this check.
    validations:
      required: false
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundaries
      options:
        - label: I removed credentials, customer data, private paths, production secrets, and other sensitive material.
          required: true
        - label: I understand that a declaration PASS does not grant runtime authority or prove identity, execution, or artifact authenticity.
          required: true
