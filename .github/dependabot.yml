version: 2

# Cost-balanced maintenance for the public OSS release path.
# The package currently has no third-party npm dependencies, so npm version-update
# PRs would add CI noise without reducing meaningful dependency risk. GitHub Actions
# version updates are pinned by SHA and refreshed as one monthly reviewed batch.
# Dependabot security updates, when enabled in repository settings, remain event-driven rather than waiting for that monthly cadence.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      github-actions:
        patterns:
          - "*"
